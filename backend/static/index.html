<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>BrainLink — Winston Churchill</title>
<style>
body { font-family: system-ui; background: #0a0a0a; color: #f0f0f0; margin: 0; padding: 20px; }
.container { max-width: 800px; margin: auto; }
h1 { color: #c6b39a; }
#chat { border: 1px solid #333; height: 400px; overflow-y: auto; padding: 15px; background: #111; border-radius: 8px; }
.message { margin: 10px 0; padding: 10px; border-radius: 6px; }
.user { background: #1a3a5c; text-align: right; }
.ai { background: #2a2a2a; }
input, button { padding: 10px; margin: 5px; border-radius: 4px; border: none; }
button { background: #ff6a1a; color: white; cursor: pointer; }
#controls { margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
<h1>BrainLink — Winston Churchill</h1>
<p>NeuroCore active. Moral Filter: <span id="moral-status">ON</span></p>
<div id="chat"></div>
<input id="msg" placeholder="Speak to Churchill..." style="width:70%">
<button onclick="send()">Send</button>
<div id="controls">
<button onclick="toggleMoral()">Toggle Moral Filter</button>
<button onclick="location.reload()">Reset Session</button>
</div>
</div>
<script>
async function send() {
  const msg = document.getElementById('msg').value;
  if (!msg) return;
  const chat = document.getElementById('chat');
  chat.innerHTML += `<div class="message user">${msg}</div>`;
  document.getElementById('msg').value = '';
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: msg})
  });
  const data = await res.json();
  chat.innerHTML += `<div class="message ai">${data.reply}</div>`;
  chat.scrollTop = chat.scrollHeight;
}
document.getElementById('msg').addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
async function toggleMoral() {
  const res = await fetch('/api/toggle-moral', {method: 'POST'});
  const data = await res.json();
  document.getElementById('moral-status').textContent = data.moral_filter ? 'ON' : 'OFF';
}
</script>
</body>
</html>
